name: matcad

# Matcad + Caddy, straight from GHCR. No build required.
#   Start:   docker compose up -d
#   Update:  docker compose pull && docker compose up -d
#   Pin a version: change ":latest" below to e.g. ":0.4.9"

services:
  caddy:
    image: ghcr.io/real-ttx/matcad-caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-logs:/caddy-logs

  matcad:
    image: ghcr.io/real-ttx/matcad:latest
    restart: unless-stopped
    depends_on:
      - caddy
    ports:
      - "4433:4433"
    # None of these is required (see the README, "Platform API and sign-in through MatIdentity").
    # environment:
    #   Matcad__ApiKey: ""                 # the engine API /api/v1 (Mattiverse sets it)
    #   MAT_API_KEY: ""                    # the key of /api/* (default: Matcad__ApiKey)
    #   MATIDENTITY_AUTHORITY: ""          # https://id.example.com: sign-in through MatIdentity
    #   MATIDENTITY_CLIENT_ID: "matcad"
    #   MATIDENTITY_CLIENT_SECRET: ""
    #   MATIDENTITY_INTERNAL_URL: ""       # http://matidentity:2300 inside Docker
    volumes:
      - matcad-data:/data
      - caddy-logs:/caddy-logs

volumes:
  matcad-data:
  caddy-data:
  caddy-logs:
