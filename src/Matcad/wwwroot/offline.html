<!DOCTYPE html>
<html lang="en" data-app="matcad">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex" />
  <title>Offline · Matcad</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <!-- Served by the service worker whenever Matcad cannot be reached: it needs only files the service worker keeps (the toolkit and its script). -->
  <script src="/matui/matui.boot.js"></script>
  <link rel="stylesheet" href="/matui/matui.css" />
</head>
<body>
  <main class="mat-auth" id="main">
    <div class="mat-auth__card">
      <div class="mat-empty">
        <span class="mat-empty__icon"><svg class="mat-icon" aria-hidden="true" focusable="false"><use href="/matui/matui-icons.svg#mat-i-alert"></use></svg></span>
        <h1 class="mat-empty__title">Matcad can't be reached</h1>
        <p>There is no connection to the server. Check your network, or whether Matcad is running. Nothing was lost: this page reconnects by itself.</p>
        <button type="button" class="mat-btn mat-btn--primary" id="retry"><svg class="mat-icon" aria-hidden="true" focusable="false"><use href="/matui/matui-icons.svg#mat-i-refresh"></use></svg><span>Try again</span></button>
        <p class="mat-muted" id="status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>
  <script src="/js/offline.js"></script>
</body>
</html>
