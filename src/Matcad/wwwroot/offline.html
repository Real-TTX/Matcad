<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#121830" />
  <meta name="robots" content="noindex" />
  <title>Offline · Matcad</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <!-- Served by the service worker whenever Matcad cannot be reached, so it carries everything it needs itself. -->
  <style>
    :root { --accent: #6366f1; --accent-grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #06b6d4 100%); --chrome: #121830;
      --bg: #f1f2f9; --surface: #fff; --border: rgba(24,32,78,.10); --text: #151a33; --text-muted: #5d6385; --warning: #c77700; --warning-bg: rgba(245,158,11,.16); --success: #12a05c;
      --wallpaper: radial-gradient(900px 480px at 8% -8%, rgba(99,102,241,.22), transparent 60%), radial-gradient(760px 420px at 100% 0%, rgba(34,211,238,.18), transparent 60%); }
    [data-theme="dark"] { --bg: #0a0e1d; --surface: #121830; --border: rgba(255,255,255,.08); --text: #eaeefc; --text-muted: #9aa3c7; --warning: #fbbf24; --warning-bg: rgba(251,191,36,.14); --success: #3ddc97;
      --wallpaper: radial-gradient(900px 520px at 6% -10%, rgba(99,102,241,.34), transparent 60%), radial-gradient(760px 460px at 100% 2%, rgba(6,182,212,.22), transparent 60%); }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
      padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
      color: var(--text); background: var(--wallpaper), var(--bg); -webkit-tap-highlight-color: rgba(99,102,241,.16); }
    body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: env(safe-area-inset-top, 0px); background: var(--chrome); pointer-events: none; }
    main { width: min(440px, 100%); text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 36px 28px; box-shadow: 0 10px 40px rgba(24,32,78,.16); }
    .icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px; display: grid; place-items: center; background: var(--warning-bg); color: var(--warning); }
    h1 { margin: 0 0 8px; font-size: 1.4rem; letter-spacing: -.01em; }
    p { margin: 0 0 18px; color: var(--text-muted); }
    #status { min-height: 1.5em; font-size: .9rem; }
    button { touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 9px 24px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--accent-grad); color: #fff; font: inherit; font-weight: 600; }
    button:active { transform: scale(.97); }
    button[disabled] { opacity: .6; cursor: default; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1>Matcad can't be reached</h1>
    <p>There is no connection to the server. Check your network, or whether Matcad is running. Nothing was lost: this page reconnects by itself.</p>
    <button type="button" id="retry">Try again</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('matcad-theme') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { }

      var status = document.getElementById('status');
      var button = document.getElementById('retry');
      var delay = 3000, timer = null, checking = false;

      // After a failed form post the service worker sends us here with ?to=<the page that held the form>.
      // Only addresses on this site are followed.
      function target() {
        var to = new URLSearchParams(location.search).get('to');
        if (to) {
          try { var u = new URL(to, location.origin); if (u.origin === location.origin && u.pathname !== '/offline.html') { return u.href; } } catch (e) { }
        }
        return /\/offline\.html$/.test(location.pathname) ? '/' : location.href;
      }

      function check() {
        if (checking) { return; }
        checking = true; button.disabled = true; status.textContent = 'Checking the connection...';
        clearTimeout(timer);
        var ctl = window.AbortController ? new AbortController() : null;
        var abort = setTimeout(function () { if (ctl) { ctl.abort(); } }, 6000);
        fetch('/healthz', { cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
          .then(function (r) {
            clearTimeout(abort);
            if (!r.ok) { throw new Error('HTTP ' + r.status); }
            status.textContent = 'Connected. Loading...';
            location.replace(target());
          })
          .catch(function () {
            clearTimeout(abort);
            checking = false; button.disabled = false;
            status.textContent = 'Still offline. Trying again in ' + Math.round(delay / 1000) + ' seconds.';
            timer = setTimeout(check, delay);
            delay = Math.min(delay * 2, 30000);
          });
      }

      button.addEventListener('click', function () { delay = 3000; check(); });
      window.addEventListener('online', function () { delay = 3000; check(); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) { check(); } });
      check();
    })();
  </script>
</body>
</html>
