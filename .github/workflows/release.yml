name: Release

# Build the Matcad + Caddy images and publish them to GHCR.
# Triggers on a version tag (v1.2.3) or manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # DNS-provider modules baked into the published Caddy + Matcad images.
  # Keep in sync with .env. Add more from https://github.com/caddy-dns .
  CADDY_DNS_MODULES: >-
    github.com/caddy-dns/netcup
    github.com/caddy-dns/cloudflare
    github.com/caddy-dns/digitalocean
    github.com/caddy-dns/hetzner
    github.com/caddy-dns/route53
    github.com/caddy-dns/gandi
    github.com/caddy-dns/desec
    github.com/caddy-dns/ovh
  # Go-module replaces for the Caddy build (same mechanism as .env CADDY_DNS_REPLACES).
  # Empty = published images carry the legacy netcup module only. To ship the "Netcup"
  # (CloudDNS, new REST API) provider in the released images, set this to
  #   github.com/libdns/netcup=github.com/Real-TTX/libdns-netcup@<sha>
  # where <sha> is a commit of your fork whose go.mod declares
  # `module github.com/Real-TTX/libdns-netcup` (see .env for the full fork steps).
  CADDY_DNS_REPLACES: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Matcad.Tests --configuration Release

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU is a safety net; the Dockerfiles cross-compile on the native runner,
      # so arm64 builds don't actually emulate.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version
        id: ver
        # Tag "v0.2.0" -> "0.2.0"; manual runs -> "dev".
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push matcad
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.v }}
            CADDY_DNS_MODULES=${{ env.CADDY_DNS_MODULES }}
            CADDY_DNS_REPLACES=${{ env.CADDY_DNS_REPLACES }}
          tags: |
            ghcr.io/real-ttx/matcad:${{ steps.ver.outputs.v }}
            ghcr.io/real-ttx/matcad:latest

      - name: Build & push caddy
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          file: caddy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CADDY_DNS_MODULES=${{ env.CADDY_DNS_MODULES }}
            CADDY_DNS_REPLACES=${{ env.CADDY_DNS_REPLACES }}
          tags: |
            ghcr.io/real-ttx/matcad-caddy:${{ steps.ver.outputs.v }}
            ghcr.io/real-ttx/matcad-caddy:latest
