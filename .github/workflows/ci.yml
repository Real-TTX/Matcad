name: CI

# Build and test every push and pull request on the two long-lived branches.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Matcad/Matcad.csproj --configuration Release
      - run: dotnet test tests/Matcad.Tests --configuration Release
